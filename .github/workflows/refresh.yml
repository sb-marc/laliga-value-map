name: Daily refresh

# Rebuilds index.html from the live Biwenger feed and commits it back.
# GitHub Pages (deploy-from-branch) then serves the new build automatically.
# Runs entirely on GitHub's servers - no laptop involved.

on:
  schedule:
    - cron: "10 5 * * *"   # 05:10 UTC  (~07:10 CEST summer / 06:10 CET winter)
  workflow_dispatch: {}     # "Run workflow" button for manual / test runs

permissions:
  contents: write           # let the job commit index.html + data/archive back

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history so rebase-before-push is reliable

      - name: Build the value map
        shell: pwsh
        run: |
          ./scripts/generate_value_map.ps1 -ProjectRoot .
          Copy-Item laliga_value_map.html index.html -Force

      - name: Commit and push if changed
        run: |
          git config user.name  "laliga-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/archive
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "refresh $(date -u +'%Y-%m-%d %H:%MZ')"
          # The branch may have moved since checkout (a human push, or another run).
          # Rebase onto the latest and retry a few times before giving up.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt failed; retrying in 5s"
            sleep 5
          done
          echo "could not push after 5 attempts" >&2
          exit 1
