name: Daily refresh

# Rebuilds index.html from the live Biwenger feed and commits it back.
# GitHub Pages (deploy-from-branch) then serves the new build automatically.
# Runs entirely on GitHub's servers - no laptop involved.

on:
  schedule:
    - cron: "10 5 * * *"   # 05:10 UTC  (~07:10 CEST summer / 06:10 CET winter)
  workflow_dispatch: {}     # "Run workflow" button for manual / test runs

permissions:
  contents: write           # let the job commit index.html + data/archive back

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the value map
        shell: pwsh
        run: |
          ./scripts/generate_value_map.ps1 -ProjectRoot .
          Copy-Item laliga_value_map.html index.html -Force

      - name: Commit and push if changed
        run: |
          git config user.name  "laliga-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # index.html is a full regeneration, never a merge. On a push race we do
          # NOT rebase (that conflicts on the timestamp); we re-point the branch at
          # the newest main and rebuild the commit on top of it, then push again.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --soft origin/main
            git add index.html data/archive
            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi
            git commit --quiet -m "refresh $(date -u +'%Y-%m-%d %H:%MZ')"
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt: push raced, resyncing to origin/main and retrying."
            sleep 3
          done
          echo "Could not push after 5 attempts." >&2
          exit 1
